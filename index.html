  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e69ed7a7-ca6f-490e-a359-53980c5dfa3a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"anonymous\">\n<style>/* fallback */\n@font-face {\n  font-family: 'Material Symbols Outlined';\n  font-style: normal;\n  font-weight: 300;\n  src: url(\"00c30c4d-1309-427b-a7ae-f8ce6f920669\") format('woff2');\n}\n\n.material-symbols-outlined {\n  font-family: 'Material Symbols Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin:0; padding:0; }\n  body { font-family: Helvetica, \"Helvetica Neue\", Arial, sans-serif; background:#eef2f6; }\n  a { color:#1667b5; text-decoration:none; }\n  a:hover { color:#0d4f8f; text-decoration:underline; }\n  @keyframes novaIn { from { transform: translateX(40px); opacity:0 } to { transform: translateX(0); opacity:1 } }\n  @keyframes fabPop { from { transform: scale(.6); opacity:0 } to { transform: scale(1); opacity:1 } }\n  @keyframes pulseRing { 0% { box-shadow:0 0 0 0 rgba(242,101,34,.55) } 70% { box-shadow:0 0 0 18px rgba(242,101,34,0) } 100% { box-shadow:0 0 0 0 rgba(242,101,34,0) } }\n  ::placeholder { color:#8fa4bd; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex; gap:16px; height:100vh; box-sizing:border-box; padding:16px; overflow:hidden; background:#f7f8fa\">\n\n  <div style=\"flex:0 0 430px; width:430px; background:#fff; border:2px solid #2b2f34; border-radius:10px; box-shadow:0 6px 18px rgba(20,26,34,.14); display:flex; flex-direction:column; overflow:hidden\">\n\n    <div style=\"flex:0 0 auto; background:#1b1e22; color:#fff; padding:16px 20px 15px\">\n      <div style=\"display:flex; align-items:center; gap:10px\">\n        <span style=\"font-family:'Material Symbols Outlined'; font-size:23px; color:#f26522\">school<\u002Fspan>\n        <div style=\"font-size:16px; font-weight:700; letter-spacing:.3px; flex:1\">NOVA Enablement Demo<\u002Fdiv>\n        <div style=\"font-size:12px; color:#9aa1a9\">{{ stepCounter }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px; color:#9aa1a9; margin-top:6px\">Internal enablement guide — not part of the product<\u002Fdiv>\n      <div style=\"height:4px; background:#3a3f45; border-radius:2px; margin-top:13px; overflow:hidden\">\n        <div style=\"height:4px; background:#f26522; border-radius:2px; width:{{ progressPct }}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:0 0 auto; display:flex; border-bottom:1px solid #e2e8ee\">\n      <div sc-camel-on-click=\"{{ showWalk }}\" style=\"flex:1; text-align:center; padding:11px 0; font-size:13px; font-weight:700; color:{{ walkTabColor }}; border-bottom:3px solid {{ walkTabBorder }}; cursor:pointer\">Walkthrough<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ showMap }}\" style=\"flex:1; text-align:center; padding:11px 0; font-size:13px; font-weight:700; color:{{ mapTabColor }}; border-bottom:3px solid {{ mapTabBorder }}; cursor:pointer\">All steps<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1; min-height:0; overflow-y:auto\">\n\n      <sc-if value=\"{{ onWalk }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:20px 20px 26px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:1.1px; color:#f26522\">{{ step.chapter }}<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:700; color:#12395e; margin-top:8px; line-height:1.25; text-wrap:pretty\">{{ step.title }}<\u002Fdiv>\n          <div style=\"font-size:14px; color:#3f5163; line-height:1.6; margin-top:12px; white-space:pre-line; text-wrap:pretty\">{{ step.body }}<\u002Fdiv>\n\n          <sc-if value=\"{{ step.hasAction }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:11px; align-items:flex-start; background:#fff5ef; border:1px solid #f7cdb4; border-radius:6px; padding:13px 15px; margin-top:16px\">\n              <span style=\"font-family:'Material Symbols Outlined'; font-size:20px; color:#e2571a\">touch_app<\u002Fspan>\n              <div style=\"font-size:13.5px; color:#8a3d12; line-height:1.5; font-weight:700; text-wrap:pretty\">{{ step.action }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step.hasSay }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:20px; border:1px solid #dce4ee; border-radius:6px; overflow:hidden\">\n              <div style=\"background:#f4f7fb; padding:9px 14px; font-size:11px; font-weight:700; letter-spacing:1px; color:#12395e; border-bottom:1px solid #e4eaf2\">SAY THIS — SALES NARRATIVE<\u002Fdiv>\n              <div style=\"padding:13px 14px; font-size:13.5px; color:#25384c; line-height:1.6; font-style:italic; white-space:pre-line; text-wrap:pretty\">{{ step.say }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px; border:1px solid #dce4ee; border-radius:6px; overflow:hidden\">\n              <div style=\"background:#f4f7fb; padding:9px 14px; font-size:11px; font-weight:700; letter-spacing:1px; color:#12395e; border-bottom:1px solid #e4eaf2\">SUPPORT ANGLE — WHAT TO KNOW<\u002Fdiv>\n              <div style=\"padding:13px 14px; font-size:13.5px; color:#25384c; line-height:1.6; white-space:pre-line; text-wrap:pretty\">{{ step.support }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step.hasPrompts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:1px; color:#5f6f80; margin-top:22px\">RUN THESE PROMPTS IN NOVA<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:9px; margin-top:11px\">\n                <sc-for list=\"{{ step.prompts }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ runPrompt }}\" data-prompt=\"{{ p.text }}\" style=\"display:flex; align-items:flex-start; gap:9px; border:1px solid #cddbe9; border-radius:6px; padding:11px 13px; font-size:13.5px; color:#12395e; cursor:pointer; line-height:1.45\" style-hover=\"background:#f2f7fd; border-color:#7fa9d4\">\n                    <span style=\"font-family:'Material Symbols Outlined'; font-size:18px; color:#f26522\">play_arrow<\u002Fspan>\n                    <div style=\"flex:1\">{{ p.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:12px; color:#7a8899; margin-top:10px; line-height:1.5\">Clicking a prompt types it into NOVA and plays the expected response.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step.hasVariants }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:1px; color:#5f6f80; margin-top:22px\">CUSTOMERS ALSO PHRASE IT AS<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin-top:10px\">\n                <sc-for list=\"{{ step.variants }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <div style=\"background:#f1f5f9; border-radius:12px; padding:6px 11px; font-size:12.5px; color:#4a5b6d\">{{ v.text }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step.hasFacts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:1px; color:#5f6f80; margin-top:22px\">{{ step.factsLabel }}<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:11px\">\n                <sc-for list=\"{{ step.facts }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"border-left:none; background:#f7f9fc; border:1px solid #e4eaf2; border-radius:6px; padding:12px 14px\">\n                    <div style=\"font-size:13px; font-weight:700; color:#12395e; text-wrap:pretty\">{{ f.q }}<\u002Fdiv>\n                    <div style=\"font-size:13px; color:#3f5163; line-height:1.6; margin-top:7px; white-space:pre-line; text-wrap:pretty\">{{ f.a }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ step.hasLimitDemo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:9px; margin-top:20px\">\n              <div sc-camel-on-click=\"{{ setUsage80 }}\" style=\"border:1px solid #1667b5; color:#1667b5; border-radius:16px; padding:7px 15px; font-size:13px; cursor:pointer\" style-hover=\"background:#f0f6fc\">Jump to 80% used<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ setUsage100 }}\" style=\"border:1px solid #1667b5; color:#1667b5; border-radius:16px; padding:7px 15px; font-size:13px; cursor:pointer\" style-hover=\"background:#f0f6fc\">Jump to 100% used<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ toggleTier }}\" style=\"border:1px solid #1667b5; color:#1667b5; border-radius:16px; padding:7px 15px; font-size:13px; cursor:pointer\" style-hover=\"background:#f0f6fc\">Switch tier: {{ tierLabel }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ resetUsage }}\" style=\"border:1px solid #c9d4e0; color:#5f6f80; border-radius:16px; padding:7px 15px; font-size:13px; cursor:pointer\" style-hover=\"background:#f4f7fb\">Reset counter<\u002Fdiv>\n :flex; flex-wrap:wrap; gap:8px; margin-top:10px\">\n                            <sc-for list=\"{{ m.ctas }}\" as=\"c\" hint-placeholder-count=\"2\">\n                              <div sc-camel-on-click=\"{{ onCta }}\" data-prompt=\"{{ c.prompt }}\" style=\"border:1px solid #1667b5; color:#1667b5; border-radius:16px; padding:7px 15px; font-size:13px; cursor:pointer\" style-hover=\"background:#f0f6fc\">{{ c.label }}<\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ m.hasSource }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size:11.5px; color:#8b98a8; margin-top:8px\">Source: {{ m.source }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ m.isSystem }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"background:#fff6e8; border:1px solid #f0d7ae; border-radius:6px; padding:11px 14px; font-size:13px; color:#8a5a12; line-height:1.55; white-space:pre-line; text-wrap:pretty\">{{ m.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"flex:0 0 auto; padding:6px 24px 0 24px\">\n          <div style=\"display:flex; align-items:center; gap:8px; font-size:13px; color:{{ quotaColor }}\">\n            <div>{{ quotaLine }}<\u002Fdiv>\n            <span style=\"font-family:'Material Symbols Outlined'; font-size:17px; color:#9aa8b8\">help<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:4px; background:#e7edf4; border-radius:2px; margin-top:7px; overflow:hidden\">\n            <div style=\"height:4px; background:{{ quotaColor }}; border-radius:2px; width:{{ quotaPct }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:0 0 auto; padding:14px 22px 0 22px\">\n          <div style=\"display:flex; align-items:center; gap:10px; background:#f4f8fd; border:1px solid #cbd9ea; border-radius:8px; padding:14px 16px\">\n            <input value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"Please start typing your question here...\" style=\"flex:1; border:none; outline:none; background:transparent; font-size:15px; color:#20364f; font-family:inherit\">\n            <div sc-camel-on-click=\"{{ send }}\" style=\"width:44px; height:38px; border-radius:6px; background:#e4edf7; display:flex; align-items:center; justify-content:center; cursor:pointer\" style-hover=\"background:#d3e3f4\">\n              <span style=\"font-family:'Material Symbols Outlined'; font-size:22px; color:#7fa0c4\">send<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:0 0 auto; padding:16px 34px 20px 34px; text-align:center; font-size:13px; color:#7a8899; line-height:1.5; text-wrap:pretty\">NOVA (Network Operations &amp; Visibility Assistant) can make mistakes. Consider checking important information.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;resetDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;September 1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;NOVA&quot;}}\">\nconst R = {\n  \"What products should I buy for my company?\": {\n    text: \"Happy to point you in the right direction. First — roughly how big is the environment you're protecting?\\n\\n• Up to 50 users\\n• 50–250 users\\n• 250–1,000 users\\n• 1,000+ users\\n\\nOr just describe your setup (sites, what's deployed today, what you're most worried about) and I'll match products to it.\",\n    ctas: [{ label: \"Up to 50 users\", prompt: \"Recommend a firewall for a 25-user office with heavy M365\" }, { label: \"50–250 users\", prompt: \"What do I need for a 200-employee company?\" }],\n    source: \"[Company] product marketing pages\"\n  },\n  \"Recommend a firewall for a 25-user office with heavy M365\": {\n    text: \"For 25 users with heavy Microsoft 365 traffic, I'd start with the FW-470.\\n\\n• DPI-SSL throughput headroom for encrypted M365 traffic — most cloud traffic is TLS, and inspection is where smaller units run out of room\\n• Built-in SD-WAN for direct-to-cloud breakout\\n• Room to grow to ~40 users before you feel it\\n\\nIf you expect to add sites or headcount in the next 18 months, the FW-570 gives you the next step up without a redesign.\\n\\nEither one is managed from this platform — no separate management server to stand up.\\n\\nWould you like to start a free trial to explore this in your own environment?\",\n    ctas: [{ label: \"Start a free trial\", prompt: \"How do I start a trial?\" }, { label: \"Explain the licensing\", prompt: \"Explain [Company] firewall licensing\" }],\n    source: \"Product pages, datasheets (example.com/resources)\"\n  },\n  \"Can [Company] stop ransomware?\": {\n    text: \"Ransomware gets stopped at four points, not one:\\n\\n1. Perimeter — RTDMI inspects traffic in real time and catches variants that have never been seen before.\\n2. Cloud sandbox — Capture ATP detonates unknown files before they reach the user.\\n3. Endpoint — Endpoint Protection blocks execution and can roll a machine back to its pre-infection state.\\n4. Email — the most common delivery path, filtered before it lands.\\n\\nThe layers matter because ransomware only has to get through once.\\n\\nWant to see this running against your own traffic? A free trial takes a few minutes to set up.\",\n    ctas: [{ label: \"Start a free trial\", prompt: \"How do I start a trial?\" }],\n    source: \"Product marketing, solution briefs\"\n  },\n  \"What is ZTA?\": {\n    text: \"Zero Trust Access (ZTA) is [Company]'s Zero Trust access service — it replaces traditional VPN.\\n\\nInstead of putting a user on the network, ZTA grants access per application, based on who they are and the posture of the device they're on.\\n\\nWhat's included:\\n• Zero Trust Network Access (ZTNA)\\n• Secure Web Gateway\\n• Device posture checks\\n• Unified analytics across users and apps\\n\\nPricing starts at list pricing per user/month.\\n\\nWould you like to start a free trial to explore it in your own environment?\",\n    ctas: [{ label: \"Start a free trial\", prompt: \"How do I start a trial?\" }],\n    source: \"ZTA product page, datasheet\"\n  },\n  \"What are your best products?\": {\n    text: \"The core lineup:\\n\\n• Firewall (TZ / NSa / FW-HA) — network security, from small office to data center\\n• Zero Trust Access — Zero Trust access, VPN replacement\\n• Endpoint Protection — endpoint protection with rollback\\n• Access Point — managed wireless\\n• Switch — managed wired network\\n\\nAll five are managed from this the Unified Console platform, which is free.\\n\\nWant to try any of them? I can walk you through starting a trial.\",\n    ctas: [{ label: \"Start a free trial\", prompt: \"How do I start a trial?\" }],\n    source: \"Product pages\"\n  },\n  \"Explain [Company] firewall licensing\": {\n    text: \"Two bundles, and the difference is what gets inspected:\\n\\nAPSS (Essential)\\n• IPS, Gateway Anti-Virus, Anti-Spyware\\n• Application Control\\n• Basic cloud management\\n\\nMPSS (Advanced)\\n• Everything in Essential\\n• Capture ATP cloud sandboxing — zero-day and unknown files\\n• Advanced reporting and analytics\\n• Premium cloud management with extended log retention\\n\\nThe short version: Essential covers known threats, Advanced covers the unknown ones.\\n\\nWant a side-by-side feature comparison?\",\n    ctas: [{ label: \"Show the comparison\", prompt: \"What are your best products?\" }, { label: \"Start a free trial\", prompt: \"How do I start a trial?\" }],\n    source: \"Licensing datasheet, product pages\"\n  },\n  \"Does [Company] integrate with PSA tools?\": {\n    text: \"Yes — [Company] supports PSA and RMM integration so alerts and device events flow into the ticketing system your team already works in, rather than a separate console.\\n\\nFor MSPs this usually matters most for: automatic ticket creation on device alerts, asset sync, and reporting per client tenant.\\n\\nTell me which PSA platform you run and I'll pull the specific integration steps.\",\n    source: \"Product pages, KB articles\"\n  },\n  \"How do I start a trial?\": {\n    text: \"You're already signed in to the Unified Console, so it's quick:\\n\\n1. From the Dashboard, find the product tile you want — for example Endpoint Protection.\\n2. Select Start a Trial.\\n3. Pick the tenant to run the trial under.\\n4. Confirm — the trial activates immediately and shows up under Licenses with days remaining.\\n\\nTrials run 30 days and convert to a paid license without a reinstall.\\n\\nWhich product should I set up?\",\n    ctas: [{ label: \"Endpoint Protection\", prompt: \"How do I set up my firewall?\" }, { label: \"Zero Trust Access\", prompt: \"What is ZTA?\" }],\n    source: \"the console trial workflow\"\n  },\n  \"Help me build a security solution\": {\n    text: \"Let's build it. Three questions:\\n\\n1. How many people are you protecting?\\n2. What's the top priority — ransomware, remote access, compliance, or consolidating vendors?\\n3. What's already in place that has to stay?\\n\\nAnswer those and I'll come back with products, license types, and what it costs per year.\",\n    ctas: [{ label: \"200 employees\", prompt: \"What do I need for a 200-employee company?\" }],\n    source: \"Solution agent resource set\"\n  },\n  \"What do I need for a 200-employee company?\": {\n    text: \"Here's a complete stack for 200 users:\\n\\n• Firewall — FW-670 or FW-2700 with Advanced Protection · ~$2,800/yr\\n• Zero Trust Access Business — 200 users · ~$21,600/yr\\n• Endpoint Protection — 200 endpoints · ~$9,600/yr\\n• the Unified Console — free\\n\\nTotal: roughly $34,000/yr, about $14 per user per month for perimeter, endpoint, and Zero Trust access under one console.\\n\\nI can turn this into a formal quote, or put a sales engineer on it to validate the sizing.\",\n    ctas: [{ label: \"Get a quote\", prompt: \"How do I contact sales?\" }, { label: \"Show purchasable SKUs\", prompt: \"What products can I purchase for my setup?\" }],\n    source: \"Solution builder scenario mapping\"\n  },\n  \"How do I contact sales?\": {\n    text: \"A few ways to reach us:\\n\\n• Live chat — weekdays, 8am–8pm local\\n• Phone and email are on example.com/contact\\n• Or I can have a specialist reach out to you\\n\\nIf you'd like the callback, I'll pass along a summary of what we've discussed so you don't have to repeat yourself — organization size, products discussed, and the sizing we landed on.\\n\\nShall I create that lead?\",\n    ctas: [{ label: \"Yes, create the lead\", prompt: \"What products can I purchase for my setup?\" }],\n    source: \"Sales lead workflow (the CRM)\"\n  },\n  \"What products can I purchase for my setup?\": {\n    text: \"Before I list SKUs, two quick checks:\\n\\n1. Which solution are we pricing — firewall refresh, ZTA, endpoint, or the full stack?\\n2. Confirm the billing region on your org (I see NOAM on this tenant).\\n\\nSKUs are region-specific, so I'll only show what's actually orderable for you — no EMEA or Japan-only parts in a NOAM quote.\\n\\nTell me the solution and I'll pull the exact part numbers.\",\n    ctas: [{ label: \"Firewall refresh\", prompt: \"How can I renew my firewall SN: 1234\" }],\n    source: \"SKU catalog by region\"\n  },\n  \"How can I renew my firewall SN: 1234\": {\n    text: \"Serial 1234 — TZ80, Essential Protection Service Suite, expires 12 Nov 2026.\\n\\nRenewal SKU: XYZ — TZ80 3 YR EPSS\\n\\nI'm showing you the bundle first because it renews every subscribed service on that serial in one line — cheaper and cleaner than renewing sub-services individually. If you only want a specific service renewed, tell me which and I'll pull that SKU instead.\\n\\nReady to purchase?\",\n    ctas: [{ label: \"Buy now\", prompt: \"How do I contact sales?\" }, { label: \"Contact sales to complete the order\", prompt: \"How do I contact sales?\" }],\n    source: \"the CRM renewal SKU mapped to serial number\"\n  },\n  \"How do I set up my firewall?\": {\n    text: \"I'll walk you through it. For your TZ80:\\n\\n1. Connect X0 to your LAN and X1 to your ISP handoff.\\n2. Browse to the management IP and complete the setup wizard.\\n3. Set the WAN addressing — DHCP or static from your ISP.\\n4. Confirm the DNS servers resolve, then run a ping test out to the internet.\\n5. Register the unit so licensing syncs to this platform.\\n\\nWant me to stay on step 1, or shall I move to network configuration?\",\n    ctas: [{ label: \"Network settings next\", prompt: \"How do I set up my network settings?\" }, { label: \"Security policies next\", prompt: \"How do I create access rules?\" }],\n    source: \"Getting Started Guide, KB articles\"\n  },\n  \"How do I set up my network settings?\": {\n    text: \"For your firewall, in order:\\n\\n1. Open the web management interface.\\n2. Configure X0 (LAN) — IP, subnet, and DHCP scope if you're serving addresses.\\n3. Configure X1 (WAN) — static or DHCP from the ISP.\\n4. Set DNS servers.\\n5. Verify with a ping test from a LAN client to an external address.\\n\\nIf step 5 fails, it's almost always the default route or a DNS entry — tell me what you see and I'll narrow it down.\",\n    source: \"Administration Guide, KB articles\"\n  },\n  \"How do I create access rules?\": {\n    text: \"Standard baseline on a new firewall:\\n\\n1. Policy → Rules and Policies → Access Rules.\\n2. LAN → WAN: allow, with the security services applied.\\n3. WAN → LAN: deny by default; open only what's published.\\n4. Turn on App Control to shape what leaves the network.\\n5. Add Content Filtering and Geo-IP Filtering for the categories and countries you don't do business with.\\n\\nWant me to expand any of these into full click-by-click steps?\",\n    ctas: [{ label: \"Turn on threat protection\", prompt: \"How do I turn on threat protection?\" }],\n    source: \"Administration Guide, KB articles\"\n  },\n  \"How do I turn on threat protection?\": {\n    text: \"On the firewall's security services:\\n\\n1. Enable Gateway Anti-Virus.\\n2. Enable Intrusion Prevention (IPS) — set to block high and medium severity.\\n3. Enable Capture ATP for sandboxing unknown files.\\n4. Enable Anti-Spyware.\\n5. Enable Botnet Filtering.\\n\\nOne caution: enabling all services with DPI-SSL on an undersized unit is the most common cause of \\\"the firewall got slow after we turned on security.\\\" Check the throughput headroom for your model first.\",\n    source: \"Administration Guide, KB articles\"\n  },\n  \"How do I set up a VPN?\": {\n    text: \"Tailored to your Fw_9073 running DeviceOS 7.1 — site-to-site VPN in five steps:\\n\\n1. Policy → Rules and Policies → IPSec VPN, then Add.\\n2. Set the IKE version to IKEv2 (the default for new tunnels on 7.1).\\n3. Define the local network and the remote network you're joining.\\n4. Choose authentication — pre-shared key or certificate.\\n5. Save, then bring the tunnel up and confirm it shows green under Active Tunnels.\\n\\nWant the detailed walkthrough for one of those steps, or is this a different VPN type — SSL VPN for remote users rather than site-to-site?\",\n    ctas: [{ label: \"Remote user VPN instead\", prompt: \"How do I give users VPN access?\" }, { label: \"Update my firmware first\", prompt: \"How do I update my firmware?\" }],\n    source: \"Fw_9073 config on this tenant + Administration Guide\"\n  },\n  \"How do I give users VPN access?\": {\n    text: \"For remote user access (SSL VPN) on your firewall:\\n\\n1. Enable SSL VPN on the WAN zone.\\n2. Create the client address pool and assign the routes users should reach.\\n3. Create or bind the user group allowed to connect.\\n4. Set the authentication method — local users or LDAP/AD.\\n5. Install NetExtender or Mobile Connect on a test client and confirm the connection.\\n\\nIf you're licensing more concurrent users than the unit ships with, that's an SSL VPN license add-on — I can pull the SKU.\",\n    source: \"Administration Guide, KB articles\"\n  },\n  \"How do I update my firmware?\": {\n    text: \"I checked your inventory:\\n\\n• Fw_9073 — running 9.4.1, update available: 9.4.2-7019\\n• 2 access points — updates available\\n\\nUpgrade path:\\n1. Export a settings backup from the firewall.\\n2. Download 9.4.2-7019 from the Download Center.\\n3. Schedule the window — the reboot drops traffic for a few minutes.\\n4. Upload the firmware and boot with current settings.\\n5. Verify the version and confirm tunnels and services come back up.\\n\\nUpgrade the access points first — they re-provision against the firewall's version, and doing it the other way round means a second reboot.\",\n    ctas: [{ label: \"Start with the APs\", prompt: \"How do I set up my firewall?\" }],\n    source: \"Live device inventory on this tenant + Release Notes\"\n  },\n  \"How do I link my firewall to Zero Trust Access?\": {\n    text: \"To connect Fw_9073 to Zero Trust Access:\\n\\n1. In ZTA, create a connector for the site and copy the enrollment token.\\n2. On the firewall, add the ZTA connector configuration and paste the token.\\n3. Define which internal networks the connector should publish.\\n4. Confirm the connector shows Connected in ZTA.\\n5. Assign the access policy that decides who reaches those networks.\\n\\nOnce it's up, remote users reach applications through ZTA rather than terminating a VPN on the firewall.\",\n    source: \"ZTA connector KB\"\n  }\n};\n\nconst STEPS = [\n  {\n    chapter: \"START HERE\",\n    title: \"What NOVA is, and why it's on the dashboard\",\n    body: \"NOVA — Network Operations & Visibility Assistant — is an AI assistant embedded directly in the Unified Console. It answers product, purchasing, setup and troubleshooting questions in the platform, grounded in [Company]'s own documentation.\\n\\nThis demo runs on a live copy of the the console dashboard. Follow the steps on the left; the platform on the right responds as it would in production.\",\n    say: \"\\\"Everything your team asks us today — what to buy, how to size it, how to configure it, what to renew — is a search, a ticket, or a phone call. NOVA puts that inside the platform they're already logged into.\\\"\",\n    support: \"NOVA is in the console and on example.com. Answers are grounded in [Company] marketing content, KBs and tech docs — it does not invent guidance beyond source material. On example.com, anonymous users are limited to product discovery only.\"\n  },\n  {\n    chapter: \"STEP 1 — ACCESS\",\n    title: \"Open NOVA\",\n    body: \"NOVA lives in the bottom-right of every the console screen. It's persistent — it follows the user across sub-apps, and closing it doesn't lose the conversation.\",\n    action: \"Click the orange NOVA button in the bottom-right of the dashboard.\",\n    say: \"\\\"No new tab, no new login. It's on every screen of the platform, and it already knows which org and which devices you're looking at.\\\"\",\n    support: \"The launcher is always present for signed-in the console users. Minimizing or navigating to another sub-app preserves the session and any in-progress onboarding checklist.\",\n    fabHint: true,\n    needsOpen: true\n  },\n  {\n    chapter: \"STEP 2 — THE WELCOME SCREEN\",\n    title: \"Suggestion chips do the first turn for you\",\n    body: \"The welcome screen offers five starting prompts covering the most common intents: registration, trials, product fit, product education, and troubleshooting.\\n\\nUsers can click a chip or type free text — both route to the same intent engine.\",\n    say: \"\\\"Most people don't know what to ask an AI assistant. The chips answer that for them — and each one maps to a use case we've actually built and tested.\\\"\",\n    support: \"Three trigger types matter in the requirements: suggestion chips, in-chat buttons, and free text. All three land on the same intent classification; the chips just remove the blank-page problem.\",\n    prompts: [{ text: \"I want to learn more about [Company] products.\" }],\n    needsOpen: true\n  },\n  {\n    chapter: \"USE CASE 1\",\n    title: \"Intelligent product discovery\",\n    body: \"NOVA qualifies before it recommends. Ask an open question and it asks for environment size first, then matches products to the described environment — the same qualifying questions a rep would ask.\",\n    say: \"\\\"Watch what it does before it answers — it qualifies. Size, workload, what's already deployed. Then it recommends a specific model and tells you why, not a catalog page.\\\"\",\n    support: \"Scoped to product marketing content only — no KBs, admin guides or partner material. Technical how-to questions from anonymous .com users are redirected to the console sign-in. Every discovery answer ends with a trial CTA.\",\n    prompts: [\n      { text: \"What products should I buy for my company?\" },\n      { text: \"Recommend a firewall for a 25-user office with heavy M365\" },\n      { text: \"Can [Company] stop ransomware?\" },\n      { text: \"What is ZTA?\" },\n      { text: \"Explain [Company] firewall licensing\" }\n    ],\n    variants: [\n      { text: \"Which [Company] solution fits my organization?\" },\n      { text: \"I'm not sure what I need — what should I get?\" },\n      { text: \"What firewall handles 25 users with M365 traffic?\" },\n      { text: \"Does [Company] block ransomware?\" },\n      { text: \"Is Zero Trust Access a VPN replacement?\" },\n      { text: \"What's the difference between Essential and Advanced licenses?\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 2\",\n    title: \"Trials and sign-up\",\n    body: \"Every discovery answer ends with a trial CTA. Inside the console, NOVA walks the user to the trial page; from example.com it drives account creation first.\",\n    say: \"\\\"This is the part that matters commercially. The assistant doesn't stop at an answer — it ends on 'would you like to try it in your own environment,' and it can start that trial in the same session.\\\"\",\n    support: \"In the console: navigate the user to the free trial flow. On example.com: recommend the console sign-up, then explain how trials start. Trials are 30 days and appear under Licenses with days remaining.\",\n    prompts: [{ text: \"How do I start a trial?\" }],\n    variants: [\n      { text: \"Can I try [Company] for free?\" },\n      { text: \"I'd like to try before I buy\" },\n      { text: \"Where do I start a free trial?\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 3\",\n    title: \"AI-driven solution builder\",\n    body: \"For bigger deals, NOVA collects business context — size, priority, current stack — and returns a costed, multi-product solution with a next-step CTA.\",\n    say: \"\\\"For a 200-seat prospect it returns the whole stack, priced, in under a minute. That's a first-call conversation you can have without waiting on an SE.\\\"\",\n    support: \"If no deployment scenario matches confidently, NOVA says so and offers a hand-off to sales rather than guessing. Sales leads carry the session context so the rep isn't starting cold.\",\n    prompts: [\n      { text: \"Help me build a security solution\" },\n      { text: \"What do I need for a 200-employee company?\" },\n      { text: \"How do I contact sales?\" }\n    ],\n    variants: [\n      { text: \"Design a setup for my company\" },\n      { text: \"We have 200 people, what do you recommend?\" },\n      { text: \"Can I speak to a sales engineer?\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 4\",\n    title: \"Purchase, SKUs and renewals\",\n    body: \"For signed-in the console users, NOVA returns exact orderable SKUs for the org's region, and maps a serial number to its renewal part number — bundle first.\",\n    say: \"\\\"Give it a serial number and it gives you the renewal SKU. No SKU lookup, no waiting on distribution to come back to you.\\\"\",\n    support: \"Renewal data comes from the SKU mapped to that serial in the CRM. Bundle SKU is offered first; sub-service SKUs only on request. Active service is checked first, then the most recent expired one. SKUs are filtered to the org's region.\",\n    prompts: [\n      { text: \"What products can I purchase for my setup?\" },\n      { text: \"How can I renew my firewall SN: 1234\" }\n    ],\n    variants: [\n      { text: \"My subscription is expiring, what do I do?\" },\n      { text: \"Show me SKUs for my solution\" },\n      { text: \"What products are available in my region?\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 5\",\n    title: \"Proactive onboarding\",\n    body: \"NOVA doesn't only wait to be asked. Registering a new product fires a backend event, and NOVA opens with an offer to help set that specific device up.\",\n    action: \"Click below to simulate a device registration and watch NOVA open on its own.\",\n    say: \"\\\"The customer registers a firewall and the assistant is already there, by name, offering to set it up. That's the moment onboarding usually stalls — and it's where support tickets get created.\\\"\",\n    support: \"Trigger is a backend registration event, not a user action. Progress survives navigation across sub-apps. If a user gets stuck mid-checklist, NOVA answers inline without losing the step, and escalates to a support rep if they're struggling.\",\n    trigger: true,\n    prompts: [{ text: \"How do I set up my firewall?\" }],\n    variants: [\n      { text: \"Walk me through configuring my Endpoint Protection\" },\n      { text: \"Help me get my access point running\" },\n      { text: \"How do I onboard my hardware?\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 6\",\n    title: \"How-to, config and troubleshooting\",\n    body: \"The deepest use case, and the one that deflects tickets. NOVA answers setup, configuration and troubleshooting questions using the org's own device inventory as context.\",\n    say: \"\\\"Notice it doesn't give a generic VPN article — it answers for their firewall, on their firmware version. That's the difference between a search result and an assistant.\\\"\",\n    support: \"Grounded exclusively in [Company] documentation and KB articles. If a question falls outside documented coverage, NOVA says so and offers a path to a support rep rather than improvising. Broad questions get a clarifying follow-up first.\",\n    prompts: [\n      { text: \"How do I set up a VPN?\" },\n      { text: \"How do I update my firmware?\" },\n      { text: \"How do I create access rules?\" },\n      { text: \"How do I turn on threat protection?\" },\n      { text: \"How do I give users VPN access?\" },\n      { text: \"How do I link my firewall to Zero Trust Access?\" }\n    ],\n    variants: [\n      { text: \"How do I create a site-to-site VPN?\" },\n      { text: \"Steps to upgrade firewall firmware?\" },\n      { text: \"How do I set up LAN to WAN rules?\" },\n      { text: \"Enable Gateway Anti-Virus for me\" }\n    ]\n  },\n  {\n    chapter: \"USE CASE 7\",\n    title: \"Fair usage and query limits\",\n    body: \"NOVA is free today. Usage is capped per organization, not per user, and the counter is visible in the chat header so nobody is surprised.\\n\\n• A capped monthly allocation per org\\n• 2x allocation for top-tier partners\\n• Resets on the 1st of each month\\n• A soft warning appears at 80% consumed\\n• At 100%, the session isn't killed — the user is told when the window reopens\\n\\nUse the controls below to demo each state.\",\n    say: \"\\\"It's free. There's no token bill, no per-seat charge. You get a capped monthly allocation across the whole org, more at the top partner tier, and it resets on the first. When we add the advanced use cases later, that's when a paid tier shows up — and you'll opt into it explicitly.\\\"\",\n    support: \"Limits are per org (ORG-ID) and configurable without a code deploy. At 80%, a soft in-conversation warning appears without interrupting the flow. At 100%, NOVA presents options rather than terminating the session. Nothing is charged today — Phase 1 use cases are not monetized.\",\n    limitDemo: true,\n    facts: [\n      { q: \"Why 500 and not unlimited?\", a: \"Every query costs infrastructure. The cap keeps NOVA free for everyone rather than a handful of orgs absorbing the cost. It is configurable — if an org is consistently hitting it, that's a conversation, not a hard wall.\" },\n      { q: \"What counts as a query?\", a: \"One user message and its response. Errors and human hand-offs are logged but not metered.\" },\n      { q: \"What happens at the limit?\", a: \"The session pauses rather than ends. The user is shown exactly when the next window opens. Paid continuation is a future option and requires explicit opt-in before anything is charged.\" }\n    ],\n    factsLabel: \"QUESTIONS YOU'LL GET ON LIMITS\"\n  },\n  {\n    chapter: \"OBJECTION HANDLING\",\n    title: \"What they'll push back on\",\n    body: \"The five that come up most, and how to answer them without overpromising.\",\n    say: \"\\\"Answer the limit question early and directly — it defuses the whole 'what's this going to cost me later' worry. Free today, capped, and any future paid tier is opt-in.\\\"\",\n    support: \"If you don't know, say so and hand off. NOVA is built the same way: when coverage runs out, it routes to a human rather than guessing. Never commit to a roadmap date on a call.\",\n    facts: [\n      { q: \"\\\"Is my data used to train the model?\\\"\", a: \"No. NOVA answers from [Company] documentation and your org's own data in the platform. Don't extend beyond that — route detailed data-handling questions to the security and compliance team.\" },\n      { q: \"\\\"What happens when we hit 500 queries?\\\"\", a: \"The session pauses, it doesn't end. NOVA tells the user exactly when the window reopens on the 1st. Top-tier partners get a higher allocation. If an org needs more, the limit is configurable.\" },\n      { q: \"\\\"Will you start charging us for this?\\\"\", a: \"Not for what's in Phase 1. Advanced use cases in future releases may be metered, and that would require an explicit opt-in before any charge — nobody gets a surprise bill.\" },\n      { q: \"\\\"Can it actually configure my firewall for me?\\\"\", a: \"Today it guides — step-by-step, specific to the device and firmware on your tenant. It does not push configuration changes. Be precise here; over-claiming this creates support tickets.\" },\n      { q: \"\\\"How is this different from searching the KB?\\\"\", a: \"It reads your inventory. The firmware answer names your device and the version it's on. Search can't do that, and neither can a PDF.\" }\n    ],\n    factsLabel: \"OBJECTIONS AND ANSWERS\"\n  },\n  {\n    chapter: \"WRAP\",\n    title: \"How to run this in a live call\",\n    body: \"A ten-minute version that lands with most audiences.\",\n    say: \"\\\"Open NOVA, ask the ransomware question, then the 25-user firewall question, then the renewal-by-serial-number question. Three prompts, three different jobs — educate, size, transact. Then hand them the platform and let them type their own.\\\"\",\n    support: \"For support enablement, run the how-to chapter instead: VPN setup and the firmware check. Both show inventory awareness, which is what makes the deflection argument credible.\",\n    facts: [\n      { q: \"Before the call\", a: \"Have a serial number and a rough user count ready — the specific answers land harder than the generic ones.\" },\n      { q: \"During\", a: \"Let them type. The prompt variations in this guide show how differently people phrase the same intent — NOVA handles all of them, and that's worth demonstrating live.\" },\n      { q: \"After\", a: \"If they want to keep going, NOVA can create the sales lead with the conversation summary attached, so the follow-up starts where the demo ended.\" }\n    ],\n    factsLabel: \"RUNNING THE DEMO\"\n  }\n];\n\nclass Component extends DCLogic {\n  state = { open: false, messages: [], draft: \"\", step: 0, tab: \"walk\", used: 0, topTier: false };\n\n  get limit() { return this.state.topTier ? 1000 : 500; }\n\n  push(msg) { this.setState(s => ({ messages: s.messages.concat([msg]) })); }\n\n  reply(text) {\n    const hit = R[text];\n    const answer = hit || { text: \"I can help with that. In production I'd answer from [Company] documentation, KB articles, and your org's own inventory in this platform.\\n\\nFor this demo, use one of the scripted prompts in the guide on the left to see a full response.\" };\n    this.setState(s => ({\n      messages: s.messages.concat([{ text, isUser: true }]),\n      draft: \"\",\n      used: Math.min(s.used + 1, this.limit)\n    }), () => {\n      setTimeout(() => {\n        const used = this.state.used, limit = this.limit;\n        this.push({\n          isBot: true,\n          text: answer.text,\n          ctas: answer.ctas || [],\n          hasCtas: !!(answer.ctas && answer.ctas.length),\n          source: answer.source,\n          hasSource: !!answer.source\n        });\n        if (used >= limit) {\n          setTimeout(() => this.push({ isSystem: true, text: \"You've used all \" + limit + \" queries for this month. Your allowance resets on the 1st.\\n\\nThe session stays open — you can pick this conversation back up when the window reopens, or contact your account team if your org needs a higher limit.\" }), 400);\n        } else if (used >= Math.round(limit * 0.8) && used - 1 < Math.round(limit * 0.8)) {\n          setTimeout(() => this.push({ isSystem: true, text: \"Heads up — you've used \" + used + \" of your \" + limit + \" queries this month (80%). Your allowance resets on the 1st.\" }), 400);\n        }\n      }, 420);\n    });\n  }\n\n  goTo(i) {\n    const step = Math.max(0, Math.min(STEPS.length - 1, i));\n    this.setState({ step, tab: \"walk\" });\n    if (STEPS[step].needsOpen) this.setState({ open: true });\n  }\n\n  triggerOnboarding() {\n    this.setState({ open: true, messages: [] }, () => {\n      setTimeout(() => this.push({\n        isBot: true,\n        text: \"Hi! I detected a new firewall — TZ80, serial 1234 — was just registered on this tenant.\\n\\nWould you like help setting it up? I'll walk you through initial setup, network configuration, and your first security policy.\",\n        ctas: [{ label: \"Yes, help me set it up\", prompt: \"How do I set up my firewall?\" }, { label: \"Not now\", prompt: \"What are your best products?\" }],\n        hasCtas: true,\n        source: \"Product registration event on this tenant\"\n      }), 500);\n    });\n  }\n\n  renderVals() {\n    const s = this.state, i = s.step, raw = STEPS[i], limit = this.limit;\n    const pct = Math.round((s.used / limit) * 100);\n    const near = pct >= 80;\n    const step = {\n      chapter: raw.chapter,\n      title: raw.title,\n      body: raw.body,\n      say: raw.say,\n      support: raw.support,\n      hasSay: !!raw.say,\n      action: raw.action,\n      hasAction: !!raw.action,\n      prompts: raw.prompts || [],\n      hasPrompts: !!(raw.prompts && raw.prompts.length),\n      variants: raw.variants || [],\n      hasVariants: !!(raw.variants && raw.variants.length),\n      facts: raw.facts || [],\n      hasFacts: !!(raw.facts && raw.facts.length),\n      factsLabel: raw.factsLabel || \"\",\n      hasLimitDemo: !!raw.limitDemo\n    };\n    return {\n      step,\n      allSteps: STEPS.map((st, idx) => ({\n        idx, num: idx + 1, chapter: st.chapter, title: st.title,\n        bg: idx === i ? \"#eaf2fb\" : \"transparent\",\n        dotBg: idx === i ? \"#f26522\" : (idx < i ? \"#0b2c4e\" : \"#e4eaf2\"),\n        dotColor: idx <= i ? \"#fff\" : \"#7a8899\"\n      })),\n      stepCounter: \"Step \" + (i + 1) + \" of \" + STEPS.length,\n      progressPct: Math.round(((i + 1) / STEPS.length) * 100) + \"%\",\n      nextLabel: i === STEPS.length - 1 ? \"Finish\" : \"Next step\",\n      onWalk: s.tab === \"walk\",\n      onMap: s.tab === \"map\",\n      walkTabColor: s.tab === \"walk\" ? \"#12395e\" : \"#8b98a8\",\n      walkTabBorder: s.tab === \"walk\" ? \"#f26522\" : \"transparent\",\n      mapTabColor: s.tab === \"map\" ? \"#12395e\" : \"#8b98a8\",\n      mapTabBorder: s.tab === \"map\" ? \"#f26522\" : \"transparent\",\n      showWalk: () => this.setState({ tab: \"walk\" }),\n      showMap: () => this.setState({ tab: \"map\" }),\n      jumpTo: e => this.goTo(Number(e.currentTarget.dataset.idx)),\n      nextStep: () => { if (STEPS[i].trigger) { this.triggerOnboarding(); } this.goTo(i + 1); },\n      prevStep: () => this.goTo(i - 1),\n      restart: () => this.setState({ step: 0, tab: \"walk\", open: false, messages: [], used: 0 }),\n      runPrompt: e => {\n        const t = e.currentTarget.dataset.prompt;\n        if (!this.state.open) this.setState({ open: true });\n        setTimeout(() => this.reply(t), this.state.open ? 0 : 260);\n      },\n\n      open: s.open,\n      fabVisible: !s.open,\n      fabHint: !s.open && !!raw.fabHint,\n      isWelcome: s.open && s.messages.length === 0,\n      hasMessages: s.messages.length > 0,\n      messages: s.messages,\n      draft: s.draft,\n      quotaLine: s.used + \"/\" + limit + \" Queries Used - Resets \" + (this.props.resetDate ?? \"September 1\"),\n      quotaPct: pct + \"%\",\n      quotaColor: pct >= 100 ? \"#c0392b\" : (near ? \"#e8622a\" : \"#5f6f80\"),\n      tierLabel: s.topTier ? \"Top tier\" : \"Standard\",\n      setUsage80: () => this.setState({ used: Math.round(this.limit * 0.8) }),\n      setUsage100: () => this.setState({ used: this.limit }),\n      resetUsage: () => this.setState({ used: 0 }),\n      toggleTier: () => this.setState(st => ({ topTier: !st.topTier, used: 0 })),\n\n      openPanel: () => { this.setState({ open: true }); if (STEPS[i].needsOpen && i === 1) setTimeout(() => this.goTo(2), 500); },\n      closePanel: () => this.setState({ open: false }),\n      resetChat: () => this.setState({ messages: [], draft: \"\" }),\n      onPrompt: e => this.reply(e.currentTarget.dataset.prompt),\n      onCta: e => this.reply(e.currentTarget.dataset.prompt),\n      onDraft: e => this.setState({ draft: e.target.value }),\n      onKey: e => { if (e.key === \"Enter\" && this.state.draft.trim()) this.reply(this.state.draft.trim()); },\n      send: () => { if (this.state.draft.trim()) this.reply(this.state.draft.trim()); }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
